spring.application.name=demo-modulith-sb4

# create-drop : Hibernate cree aussi la table event_publication du registre Modulith.
# En "validate", cette table n'existerait pas et le demarrage echouerait.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.modulith.events.republish-outstanding-events-on-restart=true
